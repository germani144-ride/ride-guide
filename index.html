<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://nummerplade-tjek.dk https://mobility-prices.ok.dk https://api.energidataservice.dk; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RideGuide</title>
    <meta
      name="description"
      content="What will this car really cost you? Lease, buy or finance, per month and per km."
    />
    <meta name="theme-color" content="#e8ebed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="fonts/barlow-condensed-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/forms.css" />
    <link rel="stylesheet" href="css/plate.css" />
    <link rel="stylesheet" href="css/wizard.css" />
    <link rel="stylesheet" href="css/results.css" />
    <link rel="stylesheet" href="css/lists.css" />
    <link rel="stylesheet" href="css/settings.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/new">RideGuide <span class="brand-version" id="brand-version"></span></a>
      <a id="settings-link" class="icon-button" href="#/settings" aria-label="Settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path
            d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </a>
    </header>

    <div id="splash" aria-hidden="true">
      <img src="icons/icon.svg" alt="" />
      <p class="splash-name">RideGuide</p>
      <p class="splash-version" id="splash-version"></p>
    </div>
    <script src="src/version.js"></script>
    <script src="src/boot.js"></script>

    <main id="view" tabindex="-1"></main>

    <nav id="tabs" class="tabs" aria-label="Sections"></nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
